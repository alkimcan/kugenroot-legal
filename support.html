  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KuGeNRoot Destek ve İletişim</title>
  <style>
    :root {
      --navy: #06263d;
      --orange: #ff6b00;
      --text: #172033;
      --muted: #667085;
      --bg: #f6f8fb;
      --card: #ffffff;
      --line: #e5eaf2;
    }
    body {
      font-family: Arial, sans-serif;
      max-width: 920px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
    }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(15,30,60,.08);
      border: 1px solid var(--line);
    }
    h1, h2, h3 { color: var(--navy); line-height: 1.25; }
    a { color: var(--orange); font-weight: 700; }
    .small { color: var(--muted); font-size: 14px; }
    footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 18px; }
  </style>
</head>
